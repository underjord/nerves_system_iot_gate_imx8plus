name: CI

on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_filename: ${{ steps.nerves.outputs.artifact_filename }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        id: nerves
        uses: redwirelabs/build-nerves-system-action@v1
  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
      - name: Fetch artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_filename }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ needs.build.outputs.artifact_filename }}
        run: |
          # Work-in-progress builds (v*-wip-*) are published as prereleases so
          # they can be pulled into a firmware project for testing. Real
          # release tags still get a draft for manual review.
          case "$TAG" in
            *-wip-*) release_type="--prerelease" ;;
            *) release_type="--draft" ;;
          esac
          gh release \
            create \
              "$TAG" \
              "$ARTIFACT" \
            --title "$TAG" \
            $release_type
